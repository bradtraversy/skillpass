# Render Blueprint for the SkillPass monorepo.
# Launch-lean: two services (static site + API), validation runs inline in the API
# (VALIDATION_MODE=inline), so no worker or Redis is needed. Neon Postgres and
# Cloudflare R2 stay external. Env vars marked sync: false are set in the Render
# dashboard; never put secret values in this file.
#
# To scale up later, set VALIDATION_MODE=queue on the API and re-add the worker +
# keyvalue services with a REDIS_URL from the keyvalue store (the code is retained
# in apps/api/src/worker.ts and src/queue/*).
services:
  - type: web
    name: skillpass-web
    runtime: node
    # Node service (not static) so the per-entity skill/profile pages render on
    # demand via @astrojs/node. Starter so it never spins down.
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: cd apps/web && node ./dist/server/entry.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # Bind to all interfaces; the @astrojs/node standalone server defaults to
      # localhost, which Render's port scan can't reach.
      - key: HOST
        value: 0.0.0.0
      # The public URL of skillpass-api; read at build time (islands) and at
      # request time by the on-demand pages.
      - key: PUBLIC_API_URL
        sync: false

  - type: web
    name: skillpass-api
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile
    preDeployCommand: cd apps/api && pnpm db:migrate
    startCommand: cd apps/api && node --import tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # Validate in-process; no worker or Redis required.
      - key: VALIDATION_MODE
        value: inline
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # The public URL of skillpass-web (OAuth redirects + CORS).
      - key: WEB_ORIGIN
        sync: false
