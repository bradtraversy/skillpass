# Render Blueprint for the AI Skills Directory monorepo.
# Three services + the queue's key-value store. Neon Postgres and Cloudflare R2
# stay external. Env vars marked sync: false are set in the Render dashboard;
# never put secret values in this file.
services:
  - type: web
    name: aiskills-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # The public URL of aiskills-api; baked in at build time by Astro.
      - key: PUBLIC_API_URL
        sync: false

  - type: web
    name: aiskills-api
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile
    startCommand: cd apps/api && node --import tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # The public URL of aiskills-web (OAuth redirects + CORS).
      - key: WEB_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aiskills-queue
          property: connectionString

  - type: worker
    name: aiskills-worker
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile
    startCommand: cd apps/api && node --import tsx src/worker.ts
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aiskills-queue
          property: connectionString

  # BullMQ requires noeviction so queued jobs are never silently dropped.
  - type: keyvalue
    name: aiskills-queue
    maxmemoryPolicy: noeviction
    ipAllowList: []
